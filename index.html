<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:;">
<title>Mini Browser</title>
<style>
  :root {
    --bg: #15171c;
    --bar: #1d2027;
    --tab: #262a33;
    --tab-on: #343a47;
    --line: #2f343f;
    --text: #e6e8ec;
    --dim: #8b92a1;
    --accent: #6ea8ff;
    --ok: #5fd18a;
    --warn: #f2c14e;
    --err: #ff6b6b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 6px; }
  button:hover { background: var(--tab-on); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* top 84px belongs to the shell: 36 tabs + 48 toolbar */
  #tabs { height: 36px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: var(--bg); }
  .tab { display: flex; align-items: center; gap: 6px; width: 200px; height: 30px; padding: 0 6px 0 10px;
    background: var(--tab); border-radius: 8px 8px 0 0; cursor: pointer; }
  .tab.on { background: var(--bar); box-shadow: inset 0 2px 0 var(--accent); }
  .tab img { width: 14px; height: 14px; flex: none; }
  .tab span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x { width: 20px; height: 20px; line-height: 18px; color: var(--dim); }
  #add { width: 28px; height: 28px; margin-left: 4px; font-size: 18px; }

  #toolbar { height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--bar);
    border-bottom: 1px solid var(--line); }
  #toolbar button { width: 32px; height: 32px; font-size: 16px; }
  #toolbar button:disabled { opacity: .3; cursor: default; }
  #url { flex: 1; height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  #toggle { width: auto !important; padding: 0 12px; font-size: 13px !important; }

  /* side panel sits to the right of the native web view */
  #panel { position: fixed; top: 84px; right: 0; bottom: 0; width: 460px; background: var(--bar);
    border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  body.closed #panel { display: none; }
  #ptabs { display: flex; border-bottom: 1px solid var(--line); }
  #ptabs button { flex: 1; height: 34px; border-radius: 0; color: var(--dim); }
  #ptabs button.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .pane.on { display: flex; }
  .row { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .row input[type=text] { flex: 1; height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  .row button { padding: 4px 10px; background: var(--tab); }
  .seg button.on { background: var(--accent); color: #0d1117; }
  pre { margin: 0; padding: 10px; flex: 1; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap;
    word-break: break-all; tab-size: 2; }

  #list { flex: 1; overflow: auto; min-height: 80px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
  td { padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line); }
  tr { cursor: pointer; }
  tr:hover td { background: var(--tab); }
  tr.sel td { background: var(--tab-on); }
  td.m { width: 48px; font-family: var(--mono); color: var(--dim); }
  td.s { width: 44px; font-family: var(--mono); }
  td.t { width: 64px; color: var(--dim); }
  td.z { width: 60px; text-align: right; color: var(--dim); font-family: var(--mono); }
  .s2 { color: var(--ok); } .s3 { color: var(--warn); } .s4, .s5, .sx { color: var(--err); }
  #detail { height: 45%; overflow: auto; border-top: 1px solid var(--line); padding: 8px 10px; font-size: 12px; }
  #detail h4 { margin: 10px 0 4px; font-size: 12px; color: var(--accent); font-weight: 600; }
  #detail h4:first-child { margin-top: 0; }
  #detail .kv { font-family: var(--mono); word-break: break-all; }
  #detail .kv b { color: var(--dim); font-weight: 400; }
  #detail pre { padding: 6px; background: var(--bg); border-radius: 6px; max-height: 240px; flex: none; }
  .empty { color: var(--dim); padding: 14px; }
</style>
</head>
<body>
  <div id="tabs"></div>
  <div id="toolbar">
    <button id="back" title="Back" aria-label="Back">←</button>
    <button id="fwd" title="Forward" aria-label="Forward">→</button>
    <button id="reload" title="Reload" aria-label="Reload">⟳</button>
    <input id="url" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Address">
    <button id="toggle">Inspector</button>
  </div>

  <aside id="panel">
    <div id="ptabs">
      <button data-p="src" class="on">Source</button>
      <button data-p="net">Network</button>
    </div>

    <section class="pane on" id="p-src">
      <div class="row">
        <span class="seg">
          <button data-m="raw" class="on">Raw HTML</button>
          <button data-m="dom">Rendered DOM</button>
        </span>
        <span style="flex:1"></span>
        <button id="srcRefresh">Refresh</button>
        <button id="srcCopy">Copy</button>
      </div>
      <pre id="srcView">Open a page, then press Refresh.</pre>
    </section>

    <section class="pane" id="p-net">
      <div class="row">
        <input type="text" id="filter" placeholder="Filter by URL, method or type">
        <button id="netClear">Clear</button>
        <button id="har">Export HAR</button>
      </div>
      <div id="list"></div>
      <div id="detail"><div class="empty">Select a request to see its headers and body.</div></div>
    </section>
  </aside>

<script src="renderer.js"></script>
</body>
</html>
